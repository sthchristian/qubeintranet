<svg xmlns="http://www.w3.org/2000/svg" viewBox="-228.6 -90.0 1336.1 474.2" width="900" height="319" role="img" aria-label="Qube – The QualiPro Intranet">
<title>Qube – The QualiPro Intranet</title>

<defs><filter id="tsl" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="3.0" dy="6" result="o"/><feFlood flood-color="#111214" flood-opacity="0.22"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g transform="translate(0,147.12) scale(1.6)">
<defs>
  <linearGradient id="hl-edge" gradientUnits="userSpaceOnUse" x1="-95" y1="-70" x2="95" y2="70"><stop offset="0" stop-color="#111214"/><stop offset="0.36" stop-color="#111214"/><stop offset="0.6" stop-color="#FFB817"/><stop offset="1" stop-color="#FFB817"/></linearGradient>
  <linearGradient id="hl-inner" gradientUnits="userSpaceOnUse" x1="0" y1="-60" x2="0" y2="100"><stop offset="0" stop-color="#F6F2EA"/><stop offset="0.5" stop-color="#FFF0C9"/><stop offset="1" stop-color="#FFB817"/></linearGradient>
  <linearGradient id="hl-top" gradientUnits="userSpaceOnUse" x1="-87" y1="-50" x2="87" y2="-50">
    <stop offset="0" stop-color="#111214" stop-opacity="0.17639999999999997"/><stop offset="0.5" stop-color="#FFF0C9" stop-opacity="0.54"/><stop offset="1" stop-color="#FFB817" stop-opacity="0.47"/>
  </linearGradient>
  <linearGradient id="hl-left" gradientUnits="userSpaceOnUse" x1="-80" y1="-50" x2="0" y2="100">
    <stop offset="0" stop-color="#111214" stop-opacity="0.1848"/><stop offset="0.55" stop-color="#111214" stop-opacity="0.1512"/><stop offset="1" stop-color="#111214" stop-opacity="0.08316"/>
  </linearGradient>
  <linearGradient id="hl-right" gradientUnits="userSpaceOnUse" x1="10" y1="-20" x2="87" y2="90">
    <stop offset="0" stop-color="#FFF0C9" stop-opacity="0.385"/><stop offset="0.45" stop-color="#FFB817" stop-opacity="0.55"/><stop offset="1" stop-color="#FFB817" stop-opacity="0.7000000000000001"/>
  </linearGradient>
  <radialGradient id="hl-core" gradientUnits="userSpaceOnUse" cx="6" cy="8" r="62">
    <stop offset="0" stop-color="#F6F2EA" stop-opacity="0.6"/><stop offset="0.35" stop-color="#FFF0C9" stop-opacity="0.42"/><stop offset="0.7" stop-color="#FFF0C9" stop-opacity="0.108"/><stop offset="1" stop-color="#FFF0C9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hl-halo" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="135">
    <stop offset="0" stop-color="#FFF0C9" stop-opacity="0.3"/><stop offset="0.45" stop-color="#FFF0C9" stop-opacity="0.135"/><stop offset="1" stop-color="#FFF0C9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hl-haloGold" gradientUnits="userSpaceOnUse" cx="48" cy="22" r="105">
    <stop offset="0" stop-color="#FFB817" stop-opacity="0.24"/><stop offset="0.55" stop-color="#FFB817" stop-opacity="0.09"/><stop offset="1" stop-color="#FFB817" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hl-sheen" gradientUnits="userSpaceOnUse" x1="-87" y1="-50" x2="-20" y2="40">
    <stop offset="0" stop-color="#F6F2EA" stop-opacity="0.55"/><stop offset="1" stop-color="#F6F2EA" stop-opacity="0"/>
  </linearGradient>
  <filter id="hl-glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="wide"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="tight"/>
    <feMerge><feMergeNode in="wide"/><feMergeNode in="wide"/><feMergeNode in="tight"/></feMerge>
  </filter>
  <filter id="hl-soft" x="-50%" y="-400%" width="200%" height="900%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<g>
  <ellipse cx="0" cy="118" rx="80" ry="10" fill="#111214" opacity="0.10" filter="url(#hl-soft)"/>
  <!-- ambient glow behind the glass -->
  <circle cx="0" cy="0" r="135" fill="url(#hl-halo)"/>
  <circle cx="48" cy="22" r="105" fill="url(#hl-haloGold)"/>
  <!-- see-through glass faces -->
  <polygon points="0.00,-100.00 86.60,-50.00 0.00,0.00 -86.60,-50.00" fill="url(#hl-top)"/>
  <polygon points="-86.60,-50.00 0.00,0.00 0.00,100.00 -86.60,50.00" fill="url(#hl-left)"/>
  <polygon points="0.00,0.00 86.60,-50.00 86.60,50.00 0.00,100.00" fill="url(#hl-right)"/>
  <polygon points="-86.60,-50.00 0.00,0.00 0.00,100.00 -86.60,50.00" fill="url(#hl-sheen)"/>
  <!-- light trapped inside -->
  <circle cx="6" cy="8" r="62" fill="url(#hl-core)"/>
  <!-- hidden (back) edges, visible through the glass -->
  <path d="M0.00,-100.00 L0.00,0.00 M-86.60,50.00 L0.00,0.00 L86.60,50.00" fill="none" stroke="url(#hl-edge)" stroke-width="1.6" stroke-opacity="0.45" stroke-linecap="round"/>
  <!-- glow pass -->
  <g filter="url(#hl-glow)" opacity="0.45" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0.00,-100.00 L86.60,-50.00 L86.60,50.00 L0.00,100.00 L-86.60,50.00 L-86.60,-50.00 Z" stroke="url(#hl-edge)" stroke-width="5"/>
    <path d="M-86.60,-50.00 L0.00,0.00 L86.60,-50.00 M0.00,0.00 L0.00,100.00" stroke="url(#hl-edge)" stroke-width="3.5"/>
  </g>
  <!-- crisp edges -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0.00,-100.00 L86.60,-50.00 L86.60,50.00 L0.00,100.00 L-86.60,50.00 L-86.60,-50.00 Z" stroke="url(#hl-edge)" stroke-width="3.6"/>
    <path d="M0.00,-100.00 L86.60,-50.00 L86.60,50.00 L0.00,100.00 L-86.60,50.00 L-86.60,-50.00 Z" stroke="#F6F2EA" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M-86.60,-50.00 L0.00,0.00 L86.60,-50.00 M0.00,0.00 L0.00,100.00" stroke="url(#hl-edge)" stroke-width="2.8"/>
    <path d="M-86.60,-50.00 L0.00,0.00 L86.60,-50.00 M0.00,0.00 L0.00,100.00" stroke="url(#hl-inner)" stroke-opacity="0.55" stroke-width="1.1"/>
  </g>
